<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google!</title>
    <link rel="stylesheet" href="kodluyoruz-css-odev2.css">
</head>
<body>

   
    <div class="container">
        <header class="logo-section">
            <img src="https://web.archive.org/web/19981111183552im_/http://google.stanford.edu/google.jpg" alt="Google 1998 Logo">
        </header>

    
        <main>
            <section class="search-section">
                <p>Search the web using Google!</p>
                <input type="text" size="40"><br>
                <button>10 results</button>
                <button>Google Search</button>
                <button>I'm feeling lucky</button>
            </section>

            
            <section class="info-section">
          
                <div class="box box-left">
                    <p class="box-title">Special Searches</p>
                    <ul>
                        <li><a href="#">Stanford Search</a></li>
                        <li><a href="#">Linux Search</a></li>
                    </ul>
                </div>

           
                <div class="box box-center">
                    <ul>
                        <li><a href="#">Help!</a></li>
                        <li><a href="#">About Google!</a></li>
                        <li><a href="#">Company Info</a></li>
                        <li><a href="#">Google! Logos</a></li>
                    </ul>
                </div>

                <div class="box box-right">
                    <p>Get Google!</p>
                    <p>updates monthly:</p>
                    <input type="email" placeholder="your e-mail">
                    <br>
                    <button>Subscribe</button>
                    <a href="#" class="archive-link">Archive</a>
                </div>
            </section>
        </main>

       
        <footer>
            <p>Copyright ©1998 Google Inc.</p>
        </footer>
    </div>

</body>
</html>
